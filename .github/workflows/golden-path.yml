# The golden path: the one workflow a service calls. The service states what
# it is (app, images, url); the golden path decides how it gets to Production.
# .github/workflows/pipeline.yml in the service:
#
#   name: pipeline
#   on:
#     pull_request:
#     push:
#       branches: [main]        # the default branch
#     workflow_dispatch:        # re-deliver the latest Release
#
#   jobs:
#     golden-path:
#       uses: kindorg-hq/ci/.github/workflows/golden-path.yml@v3
#       permissions: {contents: read, packages: write, pull-requests: write, deployments: write}
#       with:
#         app: pepic                         # dir under homelab-k8s/manifests/
#         images: '[{"name": "pepic"}]'      # context ".", dockerfile "Dockerfile"
#         url: https://pepic.example.com     # where the service answers
#       secrets: inherit
#
# What each trigger does:
#   pull_request      Checks: Build and Accept of the image (pull-request.yml).
#   push (default     Build the Artifact (running the Dockerfile's `test` stage
#   branch)           when it has one) → Accept → Deliver: cut release (only on
#                     a Releasable change: git-cliff tags vX.Y.Z on this very
#                     commit) → promote, re-scan, GitOps PR
#                     (release-and-deliver.yml → deliver.yml).
#   workflow_dispatch Re-deliver the latest Release: promote its Artifact again,
#                     never rebuild.
# Deliveries of one service never overtake each other: Deliver runs one at a
# time per service repo (concurrency below), and the GitOps PR refuses a
# version lower than the recorded one (actions/gitops-pr/no-downgrade.sh).
#
# It runs as the kindorg-ci GitHub App for the Release and the GitOps PR:
# vars.KINDORG_CI_APP_ID (org variable) and secrets.KINDORG_CI_APP_KEY.
name: golden-path

on:
  workflow_call:
    inputs:
      app:
        description: Application directory under homelab-k8s/manifests/
        type: string
        required: true
      images:
        description: 'JSON list of {"name", "context", "dockerfile"}; context defaults to ".", dockerfile to "Dockerfile"'
        type: string
        required: true
      url:
        description: Where the service answers, shown on its deployment
        type: string
        default: ""
      runner:
        description: Runner for the image builds (the cluster is arm64)
        type: string
        default: ubuntu-24.04-arm
      trivy-severity:
        type: string
        default: CRITICAL
      require-issue:
        description: The PR title's scope must name the work item, type(#N)
        type: boolean
        default: true
      ci-ref:
        description: Version of kindorg-hq/ci whose actions to use
        type: string
        default: v3
    secrets:
      KINDORG_CI_APP_KEY:
        # not on pull requests: Dependabot PRs get no secrets
        required: false

permissions:
  contents: read

jobs:
  # $/ is this repo (kindorg-hq/ci) at the commit being run, not the caller
  pull-request:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/pull-request.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      images: ${{ inputs.images }}
      runner: ${{ inputs.runner }}
      trivy-severity: ${{ inputs.trivy-severity }}
      require-issue: ${{ inputs.require-issue }}
      ci-ref: ${{ inputs.ci-ref }}

  # Build: artifact (with the test stage), Accept: artifact scan
  build:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      images: ${{ inputs.images }}
      runner: ${{ inputs.runner }}
      trivy-severity: ${{ inputs.trivy-severity }}
      ci-ref: ${{ inputs.ci-ref }}

  # Deliver: cut the Release (on workflow_dispatch: find the latest one), then
  # promote, re-scan, record in homelab-k8s, report.
  deliver:
    needs: build
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.build.result == 'success') ||
        github.event_name == 'workflow_dispatch')
    # Deliveries never overtake each other: one Deliver per service at a time,
    # from cutting the Release to recording it in homelab-k8s.
    # The group sits on this job, the caller, not on the jobs inside
    # release-and-deliver.yml: a job that calls a workflow holds its group until
    # the whole called workflow ends, while a group on an inner job is released
    # when that job ends — the next run could then cut its Release and record it
    # before this run records its own, rolling Production back. (The inner jobs
    # must not reuse this group: they would wait on their own caller.)
    # Not cancel-in-progress: a delivery half done is worse than a late one.
    # GitHub keeps one pending run per group and drops older pending ones; that
    # is fine — the next Release includes their commits. Workflow_dispatch
    # (re-delivery) queues in the same group.
    concurrency:
      group: golden-path-deliver-${{ github.repository }}
      cancel-in-progress: false
    uses: $/.github/workflows/release-and-deliver.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write
      deployments: write
    with:
      app: ${{ inputs.app }}
      images: ${{ inputs.images }}
      url: ${{ inputs.url }}
      trivy-severity: ${{ inputs.trivy-severity }}
      ci-ref: ${{ inputs.ci-ref }}
    secrets:
      KINDORG_CI_APP_KEY: ${{ secrets.KINDORG_CI_APP_KEY }}
