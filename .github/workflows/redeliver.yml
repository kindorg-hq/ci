# Re-deliver: the latest Release, delivered again — one Stage, Deliver, with
# the steps Ship's Deliver runs. Nothing is built: the Artifact of the release
# commit is promoted again. For a delivery that died on the way (a GitOps PR
# whose checks timed out, a report that failed, a first delivery). It cannot
# deliver an older version: the GitOps PR refuses one lower than the recorded
# one. .github/workflows/redeliver.yml in the service:
#
#   name: re-deliver
#   run-name: Re-deliver the latest Release
#   on:
#     workflow_dispatch:
#
#   jobs:
#     ci:
#       uses: kindorg-hq/ci/.github/workflows/redeliver.yml@v4
#       permissions: {contents: read, packages: write, pull-requests: write, deployments: write}
#       with:
#         app: pepic                         # as in ship.yml
#         images: '[{"name": "pepic"}]'      # as in ship.yml; only the names count
#         url: https://pepic.example.com
#       secrets: inherit
#
# and `gh workflow run redeliver.yml` starts it. The graph is one box,
# `ci / Deliver`; the summary is headed "Re-deliver vX.Y.Z". The run-name is
# the caller's and static: the version is known only once the run has found
# the Release (and a reusable workflow's own run-name is ignored). Three steps:
#   Find the latest Release   its tag, URL and commit (gh release view)
#   Deliver the Release       actions/deliver, as Ship runs it: the Artifact
#                             of the release commit found in ghcr
#                             (ghcr.io/<owner>/<name>:<release-commit-sha>
#                             per image; none for that commit fails here),
#                             promoted → :X.Y.Z, same digest, re-scanned,
#                             recorded in homelab-k8s (GitOps PR: no
#                             downgrade, pinned by digest, the Release on the
#                             Application, verified to run every
#                             image@digest, an open PR of an earlier attempt
#                             reused, checks waited for, merged), reported on
#                             the PRs
#   Summary                   naming the part that failed, if one did
# A version already recorded changes nothing in homelab-k8s ("Manifests already
# at …", no PR); the report then labels and comments only where that is
# missing, and leaves existing comments and the `production` deployment as
# they are, so a Release already running stays running.
#
# Ship's Deliver job and this one differ only in how they get the Release (cut
# it / find the latest) and where the Artifact list comes from (Build / found
# in ghcr for the release commit); Delivery itself is one module. One
# concurrency group with Ship: a re-delivery waits for a Ship's Deliver of the
# same service, and the other way round.
#
# Runs as the kindorg-ci GitHub App for the GitOps PR: vars.KINDORG_CI_CLIENT_ID
# (org variable) and secrets.KINDORG_CI_APP_KEY.
name: redeliver

on:
  workflow_call:
    inputs:
      app:
        description: Application directory under homelab-k8s/manifests/
        type: string
        required: true
      images:
        description: 'JSON list of {"name"} — the images of the service, as ship.yml takes them'
        type: string
        required: true
      url:
        description: Where the service answers, shown on its deployment
        type: string
        default: ""
      trivy-severity:
        type: string
        default: CRITICAL
      ci-ref:
        description: Version of kindorg-hq/ci whose actions to use
        type: string
        default: v4
      dry-run:
        description: >
          Self-test: promote to a throw-away tag, record in a copy of
          fixtures/gitops (app hello-dry-run), report as a dry run;
          homelab-k8s untouched, nothing written on PRs
        type: boolean
        default: false
    secrets:
      KINDORG_CI_APP_KEY:
        description: The kindorg-ci App's key; not needed in a dry run
        required: false

permissions:
  contents: read

jobs:
  deliver:
    name: Deliver
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # the same group as ship.yml's Deliver: one delivery per service at a
    # time; see there
    concurrency:
      group: golden-path-deliver-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      pull-requests: write
      deployments: write
    env:
      KINDORG_CI_NOTES: /tmp/kindorg-ci-notes.md
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kindorg-hq/ci
          ref: ${{ inputs.ci-ref }}
          path: .kindorg-ci
          persist-credentials: false
      # Get the Release: the latest one, its tag, URL and release commit
      - id: release
        name: Find the latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName) || {
            echo "::error::no Release to re-deliver"; exit 1; }
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the latest Release's tag is not vX.Y.Z: $tag"; exit 1; }
          url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)
          { echo "version=${tag#v}"; echo "tag=$tag"; echo "url=$url"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          echo "Re-delivering the latest Release, [$tag]($url), commit \`$sha\`: its Artifact is promoted again, nothing is rebuilt." | tee -a "$KINDORG_CI_NOTES"
      # Delivery, all of it (actions/deliver, as Ship runs it). Nothing is
      # built in this run: no `artifact`, so it finds the one Build made for
      # the release commit on merge (:<release-commit-sha>) and promotes that.
      - id: deliver
        name: Deliver the Release (promote, re-scan, record in homelab-k8s, report)
        uses: ./.kindorg-ci/actions/deliver
        with:
          version: ${{ steps.release.outputs.version }}
          tag: ${{ steps.release.outputs.tag }}
          sha: ${{ steps.release.outputs.sha }}
          release-url: ${{ steps.release.outputs.url }}
          images: ${{ inputs.images }}
          # time (and new CVEs) may have passed since this Release's Accept
          rescan: "true"
          app: ${{ inputs.app }}
          environment-url: ${{ inputs.url }}
          trivy-severity: ${{ inputs.trivy-severity }}
          dry-run: ${{ inputs.dry-run }}
          client-id: ${{ vars.KINDORG_CI_CLIENT_ID }}
          private-key: ${{ secrets.KINDORG_CI_APP_KEY }}
          token: ${{ github.token }}

      - name: Summary
        if: always()
        uses: ./.kindorg-ci/actions/delivery-summary
        with:
          kind: Re-deliver
          outcome: ${{ steps.deliver.outputs.outcome }}
          dry-run: ${{ inputs.dry-run }}
          version: ${{ steps.release.outputs.version }}
          release-url: ${{ steps.release.outputs.url }}
          sha: ${{ steps.release.outputs.sha || github.sha }}
          images: ${{ steps.deliver.outputs.images }}
          gitops-pr: ${{ steps.deliver.outputs.gitops-pr }}
          failed: >-
            ${{ steps.release.outcome == 'failure' && 'find the latest Release' ||
            steps.deliver.outputs.failed-at ||
            job.status == 'cancelled' && 'a cancel' ||
            job.status == 'failure' && 'set-up' || '' }}
