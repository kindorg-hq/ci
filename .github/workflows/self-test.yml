# This repo tests itself with its own checks, against its own code — not v1:
# a change here must pass before it can become the version every service uses.
# On push to main it runs inside release.self.yml, so a release waits for it.
name: self-test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  pull-request:
    uses: ./.github/workflows/pull-request.yml
    with:
      images: '[{"name": "hello", "context": "fixtures/hello", "dockerfile": "fixtures/hello/Dockerfile"}]'
      ci-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  lint:
    name: "Accept: workflows and actions are valid"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # egress audit: logs every outbound connection of this job
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          # actionlint 1.7.12 predates the self-repository syntax ($/) that
          # golden-path.yml calls its stages with; GitHub accepts it
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color \
            -ignore 'reusable workflow call "\$/'

  no-downgrade:
    # The GitOps PR's guard (actions/gitops-pr/no-downgrade.sh), run against
    # fixtures/gitops instead of homelab-k8s: a version lower than the recorded
    # one fails, an equal (re-delivery) or higher one passes, an app with no
    # version yet passes. Cases in no-downgrade.test.sh, which runs locally too.
    name: "Accept: deliveries never go backwards"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash actions/gitops-pr/no-downgrade.test.sh

  golden-path:
    # The entry a service calls, on a pull request: it must dispatch to the
    # Checks, with its stages resolved from this commit ($/).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/golden-path.yml
    # what golden-path.yml's jobs declare, though only the Checks run here
    permissions:
      contents: read
      packages: write
      pull-requests: write
      deployments: write
    with:
      app: hello
      images: '[{"name": "hello", "context": "fixtures/hello", "dockerfile": "fixtures/hello/Dockerfile"}]'
      ci-ref: ${{ github.event.pull_request.head.sha }}

  deliver-path:
    # The path a service's artifact takes after a merge: Build runs the
    # fixture's test stage and pushes the image tagged with the commit, Accept
    # scans the pushed index (that scan broke the first real release: Trivy
    # looked for linux/amd64 in an arm64 index), Deliver cuts the Release — here
    # a dry run on this repo's own history: version and notes in the summary, no
    # tag — and promotes the image without rebuilding: the digest must not change.
    name: "Build, Accept, Deliver: artifact path of the fixture"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: build
        uses: ./actions/build-image
        with:
          name: hello
          context: fixtures/hello
          dockerfile: fixtures/hello/Dockerfile
          push: "true"
          token: ${{ github.token }}
      - uses: ./actions/scan-image
        with:
          ref: ${{ steps.build.outputs.ref }}
          token: ${{ github.token }}
      - uses: ./actions/cut-release
        with:
          dry-run: "true"
      - uses: ./actions/promote-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/hello
          from-tag: ${{ github.sha }}
          to-tag: 0.0.0-pr-${{ github.event.pull_request.number }}-promoted
          token: ${{ github.token }}
