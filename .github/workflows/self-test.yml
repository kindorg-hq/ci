# This repo tests itself with its own checks, against its own code — not a released tag:
# a change here must pass before it can become the version every service uses.
# On push to main it runs inside release.self.yml, so a release waits for it.
name: self-test
# as a service's PR run reads (pull-request.yml's caller); ignored when release.self.yml calls it
run-name: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  # The pull request as a service calls it — job id `ci`, so the checks are
  # `ci / Build` and `ci / Accept`, the two names a service's ruleset requires
  # (this repo's requires them too)
  ci:
    uses: ./.github/workflows/pull-request.yml
    with:
      images: '[{"name": "hello", "context": "fixtures/hello", "dockerfile": "fixtures/hello/Dockerfile"}]'
      ci-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  lint:
    name: "Accept: workflows and actions are valid"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # egress audit: logs every outbound connection of this job
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  no-downgrade:
    # The GitOps PR's guard (actions/record/no-downgrade.sh), run against
    # fixtures/gitops instead of homelab-k8s: a version lower than the recorded
    # one fails, an equal (re-delivery) or higher one passes, an app with no
    # version yet passes. Cases in no-downgrade.test.sh, which runs locally too.
    name: "Accept: deliveries never go backwards"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash actions/record/no-downgrade.test.sh

  annotate-app:
    # The GitOps PR writes the Release on the app's ArgoCD Application
    # (actions/record/annotate-app.sh), run against a copy of
    # fixtures/gitops/apps/hello.yaml: the kindorg.dev annotations ArgoCD
    # reports running with, nothing else changed, a re-delivery byte for byte
    # the same, bad input refused. Cases in annotate-app.test.sh.
    name: "Accept: the GitOps PR writes the Release on the Application"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash actions/record/annotate-app.test.sh

  record:
    # Recording a Release in homelab-k8s (actions/record/record.sh) on a git
    # copy of fixtures/gitops: first delivery (two images), re-delivery (no
    # diff), upgrade, downgrade refused, an image name the manifests do not
    # use fails naming it (the pin would be a silent no-op), the Application
    # annotations, bad input refused. Cases in record.test.sh.
    name: "Accept: recording in homelab-k8s pins what runs"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash actions/record/record.test.sh

  record-dry-run:
    # The GitOps PR as a dry run on the real homelab-k8s (read-only App
    # token, no credentials kept, nothing pushed). The fixture app has no
    # manifests there, so it re-records what homelab-k8s records for pepic:
    # the release commit from apps/pepic.yaml, that commit's Artifact found in
    # ghcr — and expects no diff. A diff, or a pin the manifests would not
    # run, fails here before any service's delivery does.
    name: "Deliver: a dry-run record in the real homelab-k8s changes nothing"
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      APP: pepic
      YQ: mikefarah/yq:4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: token
        name: Token of the kindorg-ci App (homelab-k8s, read only)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KINDORG_CI_APP_ID }}
          private-key: ${{ secrets.KINDORG_CI_APP_KEY }}
          owner: kindorg-hq
          repositories: homelab-k8s
          permission-contents: read
      - id: recorded
        name: The Release homelab-k8s records for pepic
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          app_file=$(mktemp)
          gh api "repos/kindorg-hq/homelab-k8s/contents/apps/${APP}.yaml" -H "Accept: application/vnd.github.raw" > "$app_file"
          ann() { docker run --rm -i "$YQ" ".metadata.annotations[\"kindorg.dev/$1\"] // \"\"" < "$app_file"; }
          { echo "version=$(ann version)"; echo "sha=$(ann source-sha)"
            echo "repo=$(ann source-repo)"; echo "url=$(ann environment-url)"; } | tee -a "$GITHUB_OUTPUT"
      - id: artifact
        name: Its Artifact, found by the release commit
        uses: ./actions/find-artifact
        with:
          images: '[{"name": "pepic"}]'
          sha: ${{ steps.recorded.outputs.sha }}
          token: ${{ github.token }}
      - id: gitops
        name: Record in homelab-k8s (GitOps PR, dry run)
        uses: ./actions/gitops-pr
        with:
          dry-run: "true"
          app: ${{ env.APP }}
          version: ${{ steps.recorded.outputs.version }}
          images: ${{ steps.artifact.outputs.images }}
          source-sha: ${{ steps.recorded.outputs.sha }}
          source-repo: ${{ steps.recorded.outputs.repo }}
          environment-url: ${{ steps.recorded.outputs.url }}
          app-id: ${{ vars.KINDORG_CI_APP_ID }}
          private-key: ${{ secrets.KINDORG_CI_APP_KEY }}
      - name: No diff, no PR, and the checkout cannot push
        env:
          CHANGED: ${{ steps.gitops.outputs.changed }}
          DIFF: ${{ steps.gitops.outputs.diff }}
          PR_URL: ${{ steps.gitops.outputs.pr-url }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          [ "$CHANGED" = false ] && [ -z "$DIFF" ] || {
            echo "::error::re-recording what homelab-k8s records for ${APP} changed it:"; echo "$DIFF"; exit 1; }
          [ -z "$PR_URL" ] || { echo "::error::a dry run opened $PR_URL"; exit 1; }
          if git -C .gitops config --get-regexp '^http\..*extraheader' > /dev/null; then
            echo "::error::the dry run's checkout kept credentials"; exit 1; fi
          if git -C .gitops push --dry-run origin HEAD:refs/heads/dry-run-must-not-push 2> /dev/null; then
            echo "::error::the dry run's checkout could push"; exit 1; fi
          echo "${APP}: homelab-k8s already records it, dry run printed no diff, opened no PR, and cannot push: ok"

  artifact-list:
    # The Artifact list, {name, image, digest} per image, made once and only
    # read afterwards (actions/artifact/artifact.sh): the one name → address
    # mapping, a ref is image@digest, a malformed list fails naming the
    # entry, a list read and written again is byte for byte the same (the
    # accepted = promoted check compares two lists as strings). Cases in
    # artifact.test.sh.
    name: "Accept: the Artifact list has one shape"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash actions/artifact/artifact.test.sh

  ship:
    # Ship as a service calls it, on the fixture: `ship / Build` (the `test`
    # stage, the image pushed as :<sha>) → `ship / Accept` (Trivy over the
    # pushed index — that scan broke the first real release: Trivy looked for
    # linux/amd64 in an arm64 index) → `ship / Deliver`: the Release cut as a
    # dry run on this repo's history (version and notes in the summary, no
    # tag), the image promoted to a throw-away tag without rebuilding (digest
    # checked against Accept's), re-scanned, the report on the PRs as a dry
    # run; no GitOps PR. Its own image name, so no other job's image is
    # pushed under it.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ship.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write
      deployments: write
    with:
      app: hello
      images: '[{"name": "hello-ship", "context": "fixtures/hello", "dockerfile": "fixtures/hello/Dockerfile"}]'
      url: https://hello.example
      ci-ref: ${{ github.event.pull_request.head.sha }}
      dry-run: true

  redeliver-artifact:
    # Re-delivery promotes the Artifact of the latest Release's commit. This
    # repo's Releases have no fixture image, so give the latest one an
    # Artifact: the image Ship's Build just pushed, copied as
    # hello-redeliver:<release-commit-sha> (its own name, nothing else uses it).
    name: "Re-deliver: an Artifact for the latest Release (fixture)"
    needs: ship
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ github.token }}
          CRANE: gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source actions/artifact/artifact.sh
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)
          cfg=$(mktemp -d)
          run=(docker run --rm -u "$(id -u):$(id -g)" -v "$cfg:/cfg" -e DOCKER_CONFIG=/cfg)
          echo "$TOKEN" | "${run[@]}" -i "$CRANE" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          from="$(artifact_image hello-ship):${GITHUB_SHA}"
          to="$(artifact_image hello-redeliver):${sha}"
          "${run[@]}" "$CRANE" copy "$from" "$to"
          echo "$tag ($sha): $to = $("${run[@]}" "$CRANE" digest "$to")"
          rm -rf "$cfg"

  redeliver:
    # Re-delivery as a service calls it, on the fixture: one box,
    # `redeliver / Deliver` — the latest Release of this repo found, its
    # commit's Artifact (above) promoted to a throw-away tag and re-scanned,
    # the report as a dry run on that Release's PRs; no GitOps PR.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: redeliver-artifact
    uses: ./.github/workflows/redeliver.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write
      deployments: write
    with:
      app: hello
      images: '[{"name": "hello-redeliver"}]'
      url: https://hello.example
      ci-ref: ${{ github.event.pull_request.head.sha }}
      dry-run: true

  same-deliver:
    # Ship's Deliver and re-delivery's are two files kept step for step the
    # same from promote to report (one job each: a shared reusable workflow
    # would nest the names a level deeper). They differ only in getting the
    # Release and in the check after promote; anything else that drifts fails.
    name: "Accept: Ship and re-deliver deliver the same way"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          YQ: mikefarah/yq:4.47.2@sha256:76def1f56f456ecc1c3173ea275218ee17139bc2018c5a07887b15afd88ec03e
        run: |
          set -euo pipefail
          yq() { docker run --rm -i -v "$PWD:/repo:ro" -w /repo "$YQ" "$@"; }
          # the Deliver job (but for Ship's needs) and its steps promote (but
          # for which Artifact list it promotes), rescan, gitops, report; JSON
          # drops the comments
          q='.jobs.deliver | del(.needs)
             | .steps |= map(select(.id == "promote" or .id == "rescan" or .id == "gitops" or .id == "report"))
             | del(.steps[] | select(.id == "promote") | .with.images)'
          yq -o json "$q" .github/workflows/ship.yml > "$RUNNER_TEMP/ship.json"
          yq -o json "$q" .github/workflows/redeliver.yml > "$RUNNER_TEMP/redeliver.json"
          [ "$(yq -o json '.steps | map(.id) | join(" ")' < "$RUNNER_TEMP/ship.json")" = '"promote rescan gitops report"' ] || {
            echo "::error::ship.yml's Deliver has no promote … report steps"; exit 1; }
          diff -u "$RUNNER_TEMP/ship.json" "$RUNNER_TEMP/redeliver.json" || {
            echo "::error::ship.yml's and redeliver.yml's Deliver jobs drifted apart (above); change both"; exit 1; }
          echo "Deliver job and steps promote → report: the same in ship.yml and redeliver.yml"

  image-list:
    # The list form the workflows use — one job per Stage, images looped
    # inside it, no matrix: two fixture images (hello-list, fixtures/hello with
    # its `test` stage, and hello-worker without one; own names, so no other
    # job's image is pushed under them) built and
    # loaded, then scanned in one step; a list whose second image fails its
    # tests stops the build; then built, pushed, scanned, found again by
    # commit (re-delivery's find-artifact) and promoted in one step each, the
    # Artifact list unchanged throughout, every action's `images` output fed
    # to the next as is.
    name: "Build, Accept, Deliver: a list of images in one job"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGES: '[{"name": "hello-list", "context": "fixtures/hello", "dockerfile": "fixtures/hello/Dockerfile"}, {"name": "hello-worker", "context": "fixtures/hello-worker", "dockerfile": "fixtures/hello-worker/Dockerfile"}]'
      JQ: ghcr.io/jqlang/jq:1.8.2@sha256:b9c68867e5766576263a222e91db3de422d802069c7af70440e667a95344e486
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pull request: built and loaded locally, scanned from there
      - id: check
        uses: ./actions/build-image
        with:
          images: ${{ env.IMAGES }}
      - env:
          OUT: ${{ steps.check.outputs.images }}
        run: |
          set -euo pipefail
          echo "$OUT"
          image() { echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$1"; }
          want="[{\"name\":\"hello-list\",\"image\":\"$(image hello-list)\",\"digest\":\"\"},{\"name\":\"hello-worker\",\"image\":\"$(image hello-worker)\",\"digest\":\"\"}]"
          [ "$OUT" = "$want" ] || { echo "::error::images output: want $want"; exit 1; }
          docker image inspect "$(image hello-list)" "$(image hello-worker)" > /dev/null
      - uses: ./actions/scan-image
        with:
          images: ${{ steps.check.outputs.images }}

      # one image's tests fail: the step fails (the error names it)
      - id: broken
        continue-on-error: true
        uses: ./actions/build-image
        with:
          images: '[{"name": "hello-list", "context": "fixtures/hello", "dockerfile": "fixtures/hello/Dockerfile"}, {"name": "broken", "context": "fixtures/broken", "dockerfile": "fixtures/broken/Dockerfile"}]'
      - env:
          OUTCOME: ${{ steps.broken.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "::error::a list with a failing test stage must fail the build, got $OUTCOME"; exit 1; }
          echo "a failing image fails the list: ok"

      # merge: pushed, scanned, promoted — each one step for the whole list
      - id: build
        uses: ./actions/build-image
        with:
          images: ${{ env.IMAGES }}
          push: "true"
          token: ${{ github.token }}
      - uses: ./actions/scan-image
        with:
          images: ${{ steps.build.outputs.images }}
          token: ${{ github.token }}
      # re-delivery's way to the same list: found by the commit's tag
      - id: find
        uses: ./actions/find-artifact
        with:
          images: ${{ env.IMAGES }}
          sha: ${{ github.sha }}
          token: ${{ github.token }}
      - id: promote
        uses: ./actions/promote-image
        with:
          images: ${{ steps.find.outputs.images }}
          to-tag: 0.0.0-pr-${{ github.event.pull_request.number }}-list
          token: ${{ github.token }}
      - env:
          BUILT: ${{ steps.build.outputs.images }}
          FOUND: ${{ steps.find.outputs.images }}
          PROMOTED: ${{ steps.promote.outputs.images }}
        run: |
          set -euo pipefail
          jq() { docker run --rm -i "$JQ" "$@"; }
          echo "built:    $BUILT"
          echo "found:    $FOUND"
          echo "promoted: $PROMOTED"
          [ "$(echo "$BUILT" | jq 'length')" = 2 ] || { echo "::error::want two built images"; exit 1; }
          [ "$(echo "$BUILT" | jq 'all(.[]; .digest | startswith("sha256:"))')" = true ] || { echo "::error::a pushed image has no digest"; exit 1; }
          [ "$BUILT" = "$FOUND" ] || { echo "::error::the list found by commit differs from Build's: $BUILT → $FOUND"; exit 1; }
          [ "$BUILT" = "$PROMOTED" ] || { echo "::error::promotion changed the list: $BUILT → $PROMOTED"; exit 1; }
          echo "two images found by commit and promoted, the Artifact list unchanged: ok"
      # what Deliver re-scans: the promoted list as is
      - uses: ./actions/scan-image
        with:
          images: ${{ steps.promote.outputs.images }}
          token: ${{ github.token }}
