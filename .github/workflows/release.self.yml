# Releases of kindorg-hq/ci itself. release-please keeps a release PR with the
# changelog; merging it tags vX.Y.Z — and only then is the moving major tag
# (v1) advanced, so services on @v1 never get code that has not been released.
name: release (ci)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/release.yml
    secrets: inherit

  major-tag:
    name: Move the major tag
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KINDORG_CI_APP_ID }}
          private-key: ${{ secrets.KINDORG_CI_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          token: ${{ steps.token.outputs.token }}
      - env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          major="v${VERSION%%.*}"
          git tag -f "$major"
          git push -f origin "$major"
          echo "$major → v$VERSION" >> "$GITHUB_STEP_SUMMARY"
