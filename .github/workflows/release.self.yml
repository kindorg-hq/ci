# Releases of kindorg-hq/ci itself. On push to main self-test runs first, on
# that very commit; only when it is green does release-please run. It keeps a
# release PR with the changelog (a human merges it); merging it tags vX.Y.Z —
# and only then is the moving major tag advanced, so services on @vN never get
# code that is unreleased or untested.
name: release (ci)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    uses: ./.github/workflows/self-test.yml
    # what self-test's jobs ask for (ship.yml's and redeliver.yml's
    # included); the jobs that push packages or deliver run on PRs only
    permissions:
      contents: read
      actions: read
      pull-requests: write
      packages: write
      deployments: write

  release:
    needs: self-test
    uses: ./.github/workflows/release.yml
    secrets: inherit

  major-tag:
    name: Move the major tag
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # egress audit: logs every outbound connection of this job
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KINDORG_CI_CLIENT_ID }}
          private-key: ${{ secrets.KINDORG_CI_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          token: ${{ steps.token.outputs.token }}
      - env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          major="v${VERSION%%.*}"
          # v2 is frozen at 2.1.0: its successor is v3
          if [ "$major" = v2 ]; then
            echo "v2 is frozen at 2.1.0; v$VERSION is tagged, v2 is not moved" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag -f "$major"
          git push -f origin "$major"
          echo "$major → v$VERSION" >> "$GITHUB_STEP_SUMMARY"
