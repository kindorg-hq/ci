# DEPRECATED — use pull-request.yml. Kept so @v2 callers of checks.yml keep
# working; it forwards to pull-request.yml (the job names are the new ones).
name: checks

on:
  workflow_call:
    inputs:
      images:
        type: string
        default: "[]"
      runner:
        type: string
        default: ubuntu-24.04-arm
      trivy-severity:
        type: string
        default: CRITICAL
      ci-ref:
        type: string
        default: v2

permissions:
  contents: read
  pull-requests: read

jobs:
  pull-request:
    uses: ./.github/workflows/pull-request.yml
    with:
      images: ${{ inputs.images }}
      runner: ${{ inputs.runner }}
      trivy-severity: ${{ inputs.trivy-severity }}
      ci-ref: ${{ inputs.ci-ref }}
