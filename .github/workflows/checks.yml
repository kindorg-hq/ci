# DEPRECATED, left as it was in v2: nothing in v3 calls it, and @v1/@v2
# callers read their tag's own copy. It forwards to pull-request.yml@v2 (a ./
# path would resolve in the caller's repo). Services use golden-path.yml.
name: checks

on:
  workflow_call:
    inputs:
      images:
        type: string
        default: "[]"
      runner:
        type: string
        default: ubuntu-24.04-arm
      trivy-severity:
        type: string
        default: CRITICAL
      ci-ref:
        type: string
        default: v2

permissions:
  contents: read
  pull-requests: read

jobs:
  pull-request:
    uses: kindorg-hq/ci/.github/workflows/pull-request.yml@v2
    with:
      images: ${{ inputs.images }}
      runner: ${{ inputs.runner }}
      trivy-severity: ${{ inputs.trivy-severity }}
      ci-ref: ${{ inputs.ci-ref }}
