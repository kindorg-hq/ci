# Self-test pushes throw-away images to ghcr on every PR: each fixture's
# Build tags `:<commit-sha>`, its dry-run deliveries promote that digest to
# `0.0.0-*` (hello-ship, hello-redeliver, hello-list…). Nothing reads them
# after the run, so this deletes the old ones. A version goes only when all
# of these hold: older than 7 days, not among the package's newest 5, and
# every tag it has is `0.0.0-*` or a commit SHA. Anything tagged otherwise
# (`buildcache`, a `vX.Y.Z`, a `sha256-…` referrer) stays, and so does every
# untagged version: those are an image index's platform manifests, and one
# of a kept index must not go.
name: prune fixture images (ci)

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  # a change to this file: a dry run, listing what it would delete
  pull_request:
    paths:
      - .github/workflows/prune-fixtures.self.yml

permissions:
  contents: read

concurrency:
  group: prune-fixtures
  cancel-in-progress: false

jobs:
  prune:
    name: "Prune: self-test's throw-away fixture images"
    # API-only: a single-CPU unprivileged container is enough (as
    # release.yml's release-please job; no harden-runner there)
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      # the fixture packages give this repo's Actions admin access (self-test
      # created them), which deleting a version needs
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      PACKAGES: hello hello-ship hello-redeliver hello-list hello-worker hello-go-gate
      KEEP: "5"
      DAYS: "7"
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Delete old throw-away versions
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          throwaway='^(0\.0\.0-[A-Za-z0-9._-]+|[0-9a-f]{40})$'
          verb=deleted; [ "$DRY_RUN" = true ] && verb="would delete"
          {
            echo "### Fixture images: ${verb} what is older than ${DAYS} days, beyond the newest ${KEEP}, tagged only 0.0.0-* or a commit SHA"
            echo; echo "| Package | Versions | Tagged | ${verb^} |"; echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          total=0
          for pkg in $PACKAGES; do
            # id, created_at, tags (space separated), newest first
            rows=$(gh api --paginate "orgs/${OWNER}/packages/container/${pkg}/versions?per_page=100" \
              --jq '.[] | [(.id | tostring), .created_at, (.metadata.container.tags | join(" "))] | @tsv' | sort -t$'\t' -k2,2r)
            count=0; tagged=0; gone=0
            while IFS=$'\t' read -r id created tags; do
              [ -n "$id" ] || continue
              count=$((count + 1))
              [ -n "$tags" ] || continue          # untagged: an index's part, kept
              tagged=$((tagged + 1))
              [ "$tagged" -gt "$KEEP" ] || continue
              [[ "$created" < "$cutoff" ]] || continue
              keep=false
              for t in $tags; do [[ "$t" =~ $throwaway ]] || keep=true; done
              [ "$keep" = false ] || continue
              echo "${pkg}: ${verb} version ${id} (${created}): ${tags}"
              if [ "$DRY_RUN" != true ]; then
                gh api -X DELETE "orgs/${OWNER}/packages/container/${pkg}/versions/${id}" --silent
              fi
              gone=$((gone + 1))
            done <<< "$rows"
            total=$((total + gone))
            echo "${pkg}: ${count} versions, ${tagged} tagged, oldest $(tail -1 <<< "$rows" | cut -f2), ${verb} ${gone}"
            echo "| \`${pkg}\` | ${count} | ${tagged} | ${gone} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "${verb}: ${total} version(s)"
