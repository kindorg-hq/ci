# Pull request: what a service's PR must pass before it may merge, as two
# Stages — Build → Accept — with nothing published. One job per Stage, the
# checks as its steps, every image of the service in turn (no matrix).
# .github/workflows/pr.yml in the service:
#
#   name: pr
#   run-name: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
#   on:
#     pull_request:
#
#   jobs:
#     ci:
#       uses: kindorg-hq/ci/.github/workflows/pr.yml@v4
#       permissions: {contents: read, pull-requests: read}
#       with:
#         images: '[{"name": "pepic"}]'      # context ".", dockerfile "Dockerfile"
#
# The run reads "PR #12: feat(#7): …" (run-name sits in the caller: a called
# workflow's own is ignored); its graph is `ci / Build` → `ci / Accept`, the
# two checks the service's ruleset requires.
#   Build   the Dockerfile's `test` stage (when it has one), then each image,
#           loaded locally as local/<name>:check — tests or image fails Build.
#   Accept  each its own step, all run even when one fails, the failing one
#           named: image scan (Trivy, CRITICAL with a fix), PR title names its
#           change and work item, no secrets in the change (gitleaks), no
#           vulnerable dependencies added (public repos only: private ones need
#           GitHub Advanced Security, so the step is skipped, not failed).
# No secrets needed: Dependabot PRs get none.
name: pr

on:
  workflow_call:
    inputs:
      images:
        description: 'JSON list of {"name", "context", "dockerfile"}; context defaults to ".", dockerfile to "Dockerfile"; "[]" for none'
        type: string
        required: true
      runner:
        description: Runner for the image builds and scans (the cluster is arm64)
        type: string
        default: ubuntu-24.04-arm
      trivy-severity:
        type: string
        default: CRITICAL
      require-issue:
        description: The PR title's scope must name the work item, type(#N)
        type: boolean
        default: true
      ci-ref:
        description: Version of kindorg-hq/ci whose actions to use
        type: string
        default: v4

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    outputs:
      images: ${{ steps.build.outputs.images }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kindorg-hq/ci
          ref: ${{ inputs.ci-ref }}
          path: .kindorg-ci
          persist-credentials: false
      - id: build
        name: Tests (Dockerfile `test` stage) and image
        if: inputs.images != '[]'
        uses: ./.kindorg-ci/actions/build-image
        with:
          images: ${{ inputs.images }}
      # hand the images to Accept
      - name: Save the images for Accept
        if: inputs.images != '[]'
        env:
          IMAGES: ${{ steps.build.outputs.images }}
          JQ: ghcr.io/jqlang/jq:1.8.2@sha256:b9c68867e5766576263a222e91db3de422d802069c7af70440e667a95344e486
        run: |
          set -euo pipefail
          mapfile -t refs < <(echo "$IMAGES" | docker run --rm -i "$JQ" -r '.[].ref')
          docker save "${refs[@]}" -o /tmp/pr-images.tar
      - if: inputs.images != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-images
          path: /tmp/pr-images.tar
          retention-days: 1

  accept:
    name: Accept
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kindorg-hq/ci
          ref: ${{ inputs.ci-ref }}
          path: .kindorg-ci
          persist-credentials: false

      # Every check below runs even when one before it failed (!cancelled()),
      # so one run shows all that is wrong; any failed step fails Accept.
      - id: load
        name: Load the images from Build
        if: inputs.images != '[]'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-images
          path: /tmp
      - name: docker load
        if: steps.load.outcome == 'success'
        run: docker load -i /tmp/pr-images.tar
      - id: scan
        name: Image scan
        if: ${{ !cancelled() && inputs.images != '[]' }}
        uses: ./.kindorg-ci/actions/scan-image
        with:
          images: ${{ needs.build.outputs.images }}
          severity: ${{ inputs.trivy-severity }}

      # Squash merges make the title the commit — git-cliff (cut-release) reads
      # it, and the scope (#N) traces the change to its work item in the
      # Release notes. Dependency PRs (Dependabot) and this repo's release PRs
      # (release-please) carry their own scopes and are let through by label.
      - id: title
        name: PR title names its change and work item
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          requireScope: ${{ inputs.require-issue }}
          scopes: ${{ inputs.require-issue && '#\d+' || '' }}
          ignoreLabels: |
            autorelease: pending
            dependencies

      - id: secrets
        name: No secrets in the change
        if: ${{ !cancelled() }}
        env:
          GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # only the commits of this change, not the whole history
          range="${BASE:+$BASE..}$HEAD"
          [ -n "$BASE" ] || range="$HEAD~1..$HEAD"
          docker run --rm -v "$PWD:/repo" "$GITLEAKS" git /repo \
            --log-opts="$range" --redact --no-banner --exit-code 1

      # needs GitHub Advanced Security on private repos, free on public ones
      - id: dependencies
        name: No vulnerable dependencies added
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      # the run's one summary: what Accept checked, and how each went
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          SCAN: ${{ steps.scan.outcome }}
          TITLE: ${{ steps.title.outcome }}
          SECRETS: ${{ steps.secrets.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          PRIVATE: ${{ github.event.repository.private }}
          SEVERITY: ${{ inputs.trivy-severity }}
        run: |
          mark() {
            case "$1" in
              success) echo "passed" ;;
              failure) echo "**failed**" ;;
              skipped) echo "skipped${2:+ ($2)}" ;;
              *) echo "$1" ;;
            esac
          }
          dep_why=""
          [ "$PRIVATE" = "true" ] && dep_why="private repo: needs GitHub Advanced Security"
          {
            echo "### Accept"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Image scan (Trivy, ${SEVERITY} with a fix) | $(mark "$SCAN" "no images") |"
            echo "| PR title names its change and work item | $(mark "$TITLE" "not a pull request") |"
            echo "| No secrets in the change | $(mark "$SECRETS") |"
            echo "| No vulnerable dependencies added | $(mark "$DEPENDENCIES" "$dep_why") |"
          } >> "$GITHUB_STEP_SUMMARY"
