# The Deliver stage of the golden path, as one unit: cut the Release (on push)
# or find the latest one (on workflow_dispatch, re-delivery), then deliver it
# (deliver.yml: promote, re-scan, GitOps PR, report). golden-path.yml calls it
# from a single job that holds the service's concurrency group, so a whole
# Deliver — not just the cut — runs one at a time per service; see there.
# Not meant to be called by a service directly.
name: release-and-deliver

on:
  workflow_call:
    inputs:
      app:
        description: Application directory under homelab-k8s/manifests/
        type: string
        required: true
      images:
        description: 'JSON list of {"name"} — the images built for the release commit'
        type: string
        required: true
      url:
        description: Where the service answers, shown on its deployment
        type: string
        default: ""
      trivy-severity:
        type: string
        default: CRITICAL
      ci-ref:
        description: Version of kindorg-hq/ci whose actions to use
        type: string
        default: v3
    secrets:
      KINDORG_CI_APP_KEY:
        required: true

permissions:
  contents: read

jobs:
  release:
    name: "Deliver: cut release"
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # no concurrency of its own: the caller's group covers it (see golden-path.yml)
    permissions:
      contents: read
    outputs:
      released: ${{ steps.cut.outputs.released }}
      version: ${{ steps.cut.outputs.version }}
      tag: ${{ steps.cut.outputs.tag }}
      url: ${{ steps.cut.outputs.url }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # full history and tags: the version is computed since the last tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kindorg-hq/ci
          ref: ${{ inputs.ci-ref }}
          path: .kindorg-ci
          persist-credentials: false
      # the App, not GITHUB_TOKEN: its tag and Release may trigger workflows
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.KINDORG_CI_APP_ID }}
          private-key: ${{ secrets.KINDORG_CI_APP_KEY }}
      - id: cut
        uses: ./.kindorg-ci/actions/cut-release
        with:
          token: ${{ steps.token.outputs.token }}

  latest:
    name: "Deliver: find the latest release"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.latest.outputs.version }}
      tag: ${{ steps.latest.outputs.tag }}
      url: ${{ steps.latest.outputs.url }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName) || {
            echo "::error::no Release to re-deliver"; exit 1; }
          url=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          { echo "tag=$tag"; echo "version=${tag#v}"; echo "url=$url"; } >> "$GITHUB_OUTPUT"
          echo "Re-delivering the latest Release, [$tag]($url): its Artifact is promoted again, nothing is rebuilt." >> "$GITHUB_STEP_SUMMARY"

  # Deliver: promote and re-scan, record in homelab-k8s, report
  deliver:
    needs: [release, latest]
    if: >-
      !cancelled() &&
      (needs.release.outputs.released == 'true' || needs.latest.result == 'success')
    uses: $/.github/workflows/deliver.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write
      deployments: write
    with:
      app: ${{ inputs.app }}
      version: ${{ needs.release.outputs.version || needs.latest.outputs.version }}
      ref: ${{ needs.release.outputs.tag || needs.latest.outputs.tag }}
      release-url: ${{ needs.release.outputs.url || needs.latest.outputs.url }}
      environment-url: ${{ inputs.url }}
      images: ${{ inputs.images }}
      trivy-severity: ${{ inputs.trivy-severity }}
      ci-ref: ${{ inputs.ci-ref }}
    secrets:
      KINDORG_CI_APP_KEY: ${{ secrets.KINDORG_CI_APP_KEY }}
