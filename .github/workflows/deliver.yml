# Deliver a Release to Production — without building anything. The Artifact
# was built and scanned on merge (build.yml), tagged with its commit SHA; here
# it is promoted: the release tag's commit is resolved, that very image gets
# the version tag (same digest), is re-scanned (new CVEs since the merge), and
# is recorded in homelab-k8s by a PR — pinned by digest, labelled with the
# version. ArgoCD rolls out what lands there. Then the Release is reported on
# its PRs and the `production` deployment.
#
# release-and-deliver.yml calls it, after cutting the Release or finding the
# latest one; services do not call it directly.
#
# Only Releases are delivered; there is no rollback path — a bad Release is
# fixed forward by the next one (break-glass: see homelab-k8s README).
name: deliver

on:
  workflow_call:
    inputs:
      app:
        description: Application directory under homelab-k8s/manifests/
        type: string
        required: true
      version:
        type: string
        required: true
      ref:
        description: The release commit's ref (its tag), resolved to the commit whose Artifact is promoted
        type: string
        required: true
      release-url:
        type: string
        default: ""
      environment-url:
        description: Where the service answers, shown on the production deployment
        type: string
        default: ""
      images:
        description: 'JSON list of {"name"} — the images built for the release commit'
        type: string
        required: true
      trivy-severity:
        type: string
        default: CRITICAL
      ci-ref:
        type: string
        default: v3
    outputs:
      gitops-pr:
        value: ${{ jobs.gitops.outputs.pr-url }}
    secrets:
      KINDORG_CI_APP_KEY:
        required: true

permissions:
  contents: read

jobs:
  promote:
    name: "Deliver: promote and re-scan (${{ matrix.image.name }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kindorg-hq/ci
          ref: ${{ inputs.ci-ref }}
          path: .kindorg-ci
          persist-credentials: false
      # the artifact is tagged with the commit it was built from
      - id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.image.name }}
        run: |
          set -euo pipefail
          echo "sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/${NAME}" >> "$GITHUB_OUTPUT"
      - id: promote
        uses: ./.kindorg-ci/actions/promote-image
        with:
          image: ${{ steps.commit.outputs.image }}
          from-tag: ${{ steps.commit.outputs.sha }}
          to-tag: ${{ inputs.version }}
          token: ${{ github.token }}
      - uses: ./.kindorg-ci/actions/scan-image
        with:
          ref: ${{ steps.commit.outputs.image }}@${{ steps.promote.outputs.digest }}
          severity: ${{ inputs.trivy-severity }}
          token: ${{ github.token }}

  gitops:
    name: "Deliver: record ${{ inputs.app }} ${{ inputs.version }} in homelab-k8s"
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      pr-url: ${{ steps.pr.outputs.pr-url }}
    steps:
      # egress audit: logs every outbound connection of this job
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kindorg-hq/ci
          ref: ${{ inputs.ci-ref }}
          path: .kindorg-ci
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # the digest of the version tag just pushed: that, not the tag, goes to git
      - id: digests
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGES: ${{ inputs.images }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          jq() { docker run --rm -i ghcr.io/jqlang/jq:1.8.2@sha256:b9c68867e5766576263a222e91db3de422d802069c7af70440e667a95344e486 "$@"; }
          out='[]'
          for name in $(echo "$IMAGES" | jq -r '.[].name'); do
            digest=$(docker buildx imagetools inspect "ghcr.io/${OWNER,,}/${name}:${VERSION}" \
              --format '{{json .Manifest}}' | jq -r .digest)
            out=$(echo "$out" | jq -c --arg n "$name" --arg d "$digest" '. + [{name: $n, digest: $d}]')
          done
          echo "images=$out" >> "$GITHUB_OUTPUT"
          echo "$out" | jq .
      - id: pr
        uses: ./.kindorg-ci/actions/gitops-pr
        with:
          app: ${{ inputs.app }}
          version: ${{ inputs.version }}
          images: ${{ steps.digests.outputs.images }}
          release-url: ${{ inputs.release-url }}
          app-id: ${{ vars.KINDORG_CI_APP_ID }}
          private-key: ${{ secrets.KINDORG_CI_APP_KEY }}

  # Release recorded: every PR of it gets the `released` label and a
  # "recorded" comment, the release commit a `production` deployment; ArgoCD
  # takes both from there (running / degraded)
  report:
    name: "Deliver: report on the PRs in ${{ inputs.version }}"
    needs: gitops
    # API-only
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kindorg-hq/ci
          ref: ${{ inputs.ci-ref }}
          path: .kindorg-ci
          persist-credentials: false
      - uses: ./.kindorg-ci/actions/report-delivery
        with:
          version: ${{ inputs.version }}
          ref: ${{ inputs.ref }}
          release-url: ${{ inputs.release-url }}
          gitops-pr: ${{ needs.gitops.outputs.pr-url }}
          environment-url: ${{ inputs.environment-url }}
          token: ${{ github.token }}
