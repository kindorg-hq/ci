# Deliver a released version to the cluster: build and push the images, scan
# them, then record them in homelab-k8s through a pull request (pinned by
# digest, labelled with the version). ArgoCD rolls out what lands there.
#
#   deliver:
#     needs: release
#     if: needs.release.outputs.released == 'true'
#     uses: kindorg-hq/ci/.github/workflows/deliver.yml@v1
#     with:
#       app: pepic
#       version: ${{ needs.release.outputs.version }}
#       ref: ${{ needs.release.outputs.tag }}
#       release-url: ${{ needs.release.outputs.url }}
#       images: '[{"name": "pepic", "context": ".", "dockerfile": "Dockerfile"}]'
#     secrets: inherit
#
# Only releases are delivered; there is no rollback path — a bad release is
# fixed forward by the next one (break-glass: see homelab-k8s README).
name: deliver

on:
  workflow_call:
    inputs:
      app:
        description: Application directory under homelab-k8s/manifests/
        type: string
        required: true
      version:
        type: string
        required: true
      ref:
        description: Git ref to build (the release tag)
        type: string
        required: true
      release-url:
        type: string
        default: ""
      images:
        description: 'JSON list of {"name", "context", "dockerfile"}'
        type: string
        required: true
      runner:
        type: string
        default: ubuntu-24.04-arm
      trivy-severity:
        type: string
        default: CRITICAL
      ci-ref:
        type: string
        default: v1
    outputs:
      gitops-pr:
        value: ${{ jobs.gitops.outputs.pr-url }}
    secrets:
      KINDORG_CI_APP_KEY:
        required: true

permissions:
  contents: read

jobs:
  image:
    name: Build, push, scan (${{ matrix.image.name }})
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kindorg-hq/ci
          ref: ${{ inputs.ci-ref }}
          path: .kindorg-ci
          persist-credentials: false
      - id: build
        uses: ./.kindorg-ci/actions/build-image
        with:
          name: ${{ matrix.image.name }}
          context: ${{ matrix.image.context || '.' }}
          dockerfile: ${{ matrix.image.dockerfile || 'Dockerfile' }}
          push: "true"
          version: ${{ inputs.version }}
          token: ${{ github.token }}
      - uses: ./.kindorg-ci/actions/scan-image
        with:
          ref: ${{ steps.build.outputs.ref }}
          severity: ${{ inputs.trivy-severity }}
          token: ${{ github.token }}

  gitops:
    name: Record ${{ inputs.app }} ${{ inputs.version }} in homelab-k8s
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      pr-url: ${{ steps.pr.outputs.pr-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kindorg-hq/ci
          ref: ${{ inputs.ci-ref }}
          path: .kindorg-ci
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # the digest of the version tag just pushed: that, not the tag, goes to git
      - id: digests
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGES: ${{ inputs.images }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          out='[]'
          for name in $(echo "$IMAGES" | jq -r '.[].name'); do
            digest=$(docker buildx imagetools inspect "ghcr.io/${OWNER,,}/${name}:${VERSION}" \
              --format '{{json .Manifest}}' | jq -r .digest)
            out=$(echo "$out" | jq -c --arg n "$name" --arg d "$digest" '. + [{name: $n, digest: $d}]')
          done
          echo "images=$out" >> "$GITHUB_OUTPUT"
          echo "$out" | jq .
      - id: pr
        uses: ./.kindorg-ci/actions/gitops-pr
        with:
          app: ${{ inputs.app }}
          version: ${{ inputs.version }}
          images: ${{ steps.digests.outputs.images }}
          release-url: ${{ inputs.release-url }}
          app-id: ${{ vars.KINDORG_CI_APP_ID }}
          private-key: ${{ secrets.KINDORG_CI_APP_KEY }}
