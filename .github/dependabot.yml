# Third-party actions are pinned by SHA; Dependabot proposes the bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: "chore(deps)"}
  - package-ecosystem: github-actions
    directories: ["/actions/*"]
    schedule: {interval: weekly}
    commit-message: {prefix: "chore(deps)"}
