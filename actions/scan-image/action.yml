name: Scan image
description: >
  Trivy over a list of built images, one after the other in one step:
  operating-system packages and application dependencies. `images` is a JSON
  list of {"name", "ref"} — the `images` output of build-image or
  promote-image as is. Every image is scanned; the step fails afterwards, naming each image that failed. Fails
  on CRITICAL by default — HIGH on old base images would drown the signal.
  Runs Trivy as a pinned container, not a third-party action.
inputs:
  images:
    description: >
      JSON list of images to scan, each {"name", "ref"} (ref: local tag or
      name@digest; name labels the result, the ref when left out).
    required: true
  severity:
    description: Severities that fail the check
    default: CRITICAL
  platform:
    description: >
      Platform of the images. A pushed image is an index, and Trivy would look
      for its own default (linux/amd64) in it — we build arm64.
    default: linux/arm64
  token:
    description: Registry token, needed only to scan a pushed private image
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        SEVERITY: ${{ inputs.severity }}
        TOKEN: ${{ inputs.token }}
        PLATFORM: ${{ inputs.platform }}
        TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        JQ: ghcr.io/jqlang/jq:1.8.2@sha256:b9c68867e5766576263a222e91db3de422d802069c7af70440e667a95344e486
      run: |
        set -euo pipefail
        jq() { docker run --rm -i "$JQ" "$@"; }

        list=$(echo "$IMAGES" | jq -r '
          if type == "array" and length > 0 and all(.[]; type == "object" and (.ref | type) == "string" and .ref != "")
          then .[] | [(.name // .ref), .ref] | @tsv
          else error("bad images") end') || {
          echo "::error::scan-image: images must be a non-empty JSON list of {\"name\", \"ref\"}, got: ${IMAGES}"; exit 1; }

        auth=()
        if [ -n "$TOKEN" ]; then
          auth=(-e "TRIVY_USERNAME=${GITHUB_ACTOR}" -e "TRIVY_PASSWORD=${TOKEN}")
        fi
        failed=()
        # fd 3: docker run must not eat the list
        while IFS=$'\t' read -r -u 3 name ref; do
          # no log group: the findings stay in sight
          echo "== ${name}: ${ref}"
          if docker run --rm "${auth[@]}" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY" image --quiet --ignore-unfixed --severity "$SEVERITY" --platform "$PLATFORM" \
            --exit-code 1 --format table "$ref" < /dev/null; then
            echo "${name}: no ${SEVERITY} findings with a fix"
          else
            echo "::error::scan-image: ${name} failed the ${SEVERITY} scan (${ref})"
            failed+=("$name")
          fi
        done 3<<< "$list"
        if [ "${#failed[@]}" -gt 0 ]; then
          echo "::error::scan-image: ${#failed[@]} image(s) failed: ${failed[*]}"
          exit 1
        fi
