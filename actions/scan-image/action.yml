name: Scan image
description: >
  Trivy over a list of built images, one after the other in one step:
  operating-system packages and application dependencies. `images` is the
  Artifact list (actions/artifact/artifact.sh) — the `images` output of
  build-image, find-artifact or promote-image as is; each image is scanned
  by its ref (image@digest, or the local image when there is no digest).
  Every image is scanned; the step fails afterwards, naming each image that
  failed. Fails on CRITICAL by default — HIGH on old base images would drown the signal.
  Runs Trivy as a pinned container, not a third-party action.
inputs:
  images:
    description: >
      The Artifact list to scan: [{"name", "image", "digest"}].
    required: true
  severity:
    description: Severities that fail the check
    default: CRITICAL
  platform:
    description: >
      Platform of the images. A pushed image is an index, and Trivy would look
      for its own default (linux/amd64) in it — we build arm64.
    default: linux/arm64
  token:
    description: Registry token, needed only to scan a pushed private image
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        SEVERITY: ${{ inputs.severity }}
        TOKEN: ${{ inputs.token }}
        PLATFORM: ${{ inputs.platform }}
        TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../artifact/artifact.sh"
        list=$(artifact_rows scan-image "$IMAGES")

        auth=()
        if [ -n "$TOKEN" ]; then
          auth=(-e "TRIVY_USERNAME=${GITHUB_ACTOR}" -e "TRIVY_PASSWORD=${TOKEN}")
        fi
        failed=()
        # fd 3: docker run must not eat the list
        while IFS=$'\t' read -r -u 3 name image digest; do
          ref=$(artifact_ref "$image" "$digest")
          # no log group: the findings stay in sight
          echo "== ${name}: ${ref}"
          if docker run --rm "${auth[@]}" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY" image --quiet --ignore-unfixed --severity "$SEVERITY" --platform "$PLATFORM" \
            --exit-code 1 --format table "$ref" < /dev/null; then
            echo "${name}: no ${SEVERITY} findings with a fix"
          else
            echo "::error::scan-image: ${name} failed the ${SEVERITY} scan (${ref})"
            failed+=("$name")
          fi
        done 3<<< "$list"
        if [ "${#failed[@]}" -gt 0 ]; then
          echo "::error::scan-image: ${#failed[@]} image(s) failed: ${failed[*]}"
          exit 1
        fi
