name: Build image
description: >
  Build one container image with buildx. On a pull request it only proves the
  Dockerfile builds (loaded locally for scanning); on delivery it pushes the
  version and commit tags to ghcr and returns the digest.
inputs:
  name:
    description: Image name under ghcr.io/<owner>/ (e.g. pepic)
    required: true
  context:
    description: Build context
    default: "."
  dockerfile:
    description: Path to the Dockerfile
    default: Dockerfile
  platform:
    description: Target platform (the cluster is arm64)
    default: linux/arm64
  push:
    description: "true: push to ghcr; false: load into the local docker"
    default: "false"
  version:
    description: Release version to tag (empty on pull requests)
    default: ""
  token:
    description: Token with packages:write (only when pushing)
    default: ""
outputs:
  ref:
    description: The built image reference (local tag, or name@digest when pushed)
    value: ${{ steps.out.outputs.ref }}
  digest:
    description: Image digest (only when pushed)
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - id: tags
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        NAME: ${{ inputs.name }}
        VERSION: ${{ inputs.version }}
        PUSH: ${{ inputs.push }}
      run: |
        image="ghcr.io/${OWNER,,}/${NAME}"
        if [ "$PUSH" = "true" ]; then
          tags="${image}:${GITHUB_SHA}"
          [ -n "$VERSION" ] && tags="${tags},${image}:${VERSION}"
        else
          tags="local/${NAME}:check"
        fi
        echo "image=$image" >> "$GITHUB_OUTPUT"
        echo "tags=$tags" >> "$GITHUB_OUTPUT"

    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platform }}
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.push != 'true' }}
        tags: ${{ steps.tags.outputs.tags }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ inputs.version }}
        cache-from: type=gha,scope=${{ inputs.name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.name }}

    - id: out
      shell: bash
      env:
        PUSH: ${{ inputs.push }}
        IMAGE: ${{ steps.tags.outputs.image }}
        DIGEST: ${{ steps.build.outputs.digest }}
        NAME: ${{ inputs.name }}
      run: |
        if [ "$PUSH" = "true" ]; then
          echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
        else
          echo "ref=local/${NAME}:check" >> "$GITHUB_OUTPUT"
        fi
