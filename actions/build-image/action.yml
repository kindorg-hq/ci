name: Build image
description: >
  Build a list of container images with buildx, one after the other in one
  step: `images` is a JSON list of {"name", "context", "dockerfile"} (context
  "." and dockerfile "Dockerfile" when left out). When an image's
  Dockerfile has a `test` stage, that stage is built first: the service's
  tests run in the image's own environment, and a failure stops the Build. On
  a pull request it then only proves the Dockerfile builds (loaded locally
  under the image's address, for scanning); on merge it pushes the commit tag
  to ghcr and returns the digest. The first image that fails stops the step,
  named in the error. Its output is the Artifact list
  (actions/artifact/artifact.sh), made here. Cache: every build reads
  `ghcr.io/<owner>/<name>:buildcache` (anonymously on a pull request, so the
  package must be public) and this ref's GitHub Actions cache; a merge
  (push) writes the registry cache, mode=max, a pull request writes only its
  own GitHub Actions cache (README, "How Build caches"). Only a push to the
  default branch with `push: "true"` writes the registry cache — decided from
  the run's event, not an input, so no pull request can write a cache a merge
  reads.
inputs:
  images:
    description: >
      JSON list of images to build, each {"name", "context", "dockerfile"}
      (e.g. [{"name": "pepic"}, {"name": "pepic-worker", "dockerfile":
      "worker/Dockerfile"}]).
    required: true
  platform:
    description: Target platform (the cluster is arm64)
    default: linux/arm64
  push:
    description: "true: push to ghcr; false: load into the local docker"
    default: "false"
  token:
    description: Token with packages:write (only when pushing)
    default: ""
outputs:
  images:
    description: >
      The Artifact list, in input order: {"name", "image", "digest"} per
      image (actions/artifact/artifact.sh); digest is empty unless pushed.
      scan-image and promote-image take it as their `images`.
    value: ${{ steps.build.outputs.images }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - if: inputs.push == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    # buildx's GitHub Actions cache (type=gha) needs the runner's cache
    # endpoint and token, which only actions see; hand them to the build step
    # below (what build-push-action does for itself)
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          for (const key of ['ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_SERVICE_V2']) {
            if (process.env[key]) core.exportVariable(key, process.env[key]);
          }

    - id: build
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        PLATFORM: ${{ inputs.platform }}
        PUSH: ${{ inputs.push }}
        # the trust boundary of the registry cache (not an input: a PR
        # controls its caller): a merge's Build reads only what merges wrote
        WRITE_CACHE: ${{ inputs.push == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        SOURCE: ${{ github.server_url }}/${{ github.repository }}
        JQ: ghcr.io/jqlang/jq:1.8.2@sha256:b9c68867e5766576263a222e91db3de422d802069c7af70440e667a95344e486
      run: |
        set -euo pipefail
        jq() { docker run --rm -i "$JQ" "$@"; }
        source "$GITHUB_ACTION_PATH/../artifact/artifact.sh"

        # name, full address, context, dockerfile per image
        list=$(artifact_images build-image "$IMAGES")

        meta=$(mktemp -d)
        out=()
        # fd 3: docker run -i (jq) inside the loop must not eat the list
        while IFS=$'\t' read -r -u 3 name image context dockerfile; do
          fail() { echo "::error::build-image: ${name}: $1"; exit 1; }
          [ -f "$dockerfile" ] || fail "no Dockerfile at ${dockerfile}"

          # Cache. A merge writes every stage's layers to the registry, and
          # every build — the next merge, any PR — reads them: GitHub Actions
          # caches are per ref, so one a PR writes is never read by its merge
          # or by another PR. Any other build (a PR) writes only its own ref's
          # GitHub Actions cache, for its next push — never one a merge reads.
          # Missing or unreadable (first build, private package): the import
          # logs an error and the build goes on uncached.
          cache="${image}:buildcache"
          from=(--cache-from "type=registry,ref=${cache}" --cache-from "type=gha,scope=${name}")
          if [ "$WRITE_CACHE" = "true" ]; then
            test_to=()
            image_to=(--cache-to "type=registry,ref=${cache},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true")
          else
            test_to=(--cache-to "type=gha,mode=max,scope=${name}-test,ignore-error=true")
            image_to=(--cache-to "type=gha,mode=max,scope=${name},ignore-error=true")
          fi

          # the service's tests: a stage named `test` in its Dockerfile
          if grep -qiE '^[[:space:]]*FROM[[:space:]].*[[:space:]]AS[[:space:]]+test[[:space:]]*$' "$dockerfile"; then
            echo "::group::${name}: test stage"
            docker buildx build "$context" --file "$dockerfile" --target test \
              --platform "$PLATFORM" --output type=cacheonly \
              "${from[@]}" --cache-from "type=gha,scope=${name}-test" "${test_to[@]}" \
              || fail "\`test\` stage failed (${dockerfile})"
            echo "::endgroup::"
            echo "**${name}:** \`test\` stage passed." >> "${KINDORG_CI_NOTES:-$GITHUB_STEP_SUMMARY}"
          else
            echo "**${name} has no tests:** no \`test\` stage in \`${dockerfile}\`, nothing tested in Build." >> "${KINDORG_CI_NOTES:-$GITHUB_STEP_SUMMARY}"
          fi

          # pushed under the commit tag, or loaded locally under the address
          # itself (:latest) — nothing is pushed then
          if [ "$PUSH" = "true" ]; then
            tags=(--tag "${image}:${GITHUB_SHA}")
            output=(--push)
          else
            tags=(--tag "$image")
            output=(--load)
          fi
          echo "::group::${name}: image"
          docker buildx build "$context" --file "$dockerfile" \
            --platform "$PLATFORM" "${tags[@]}" "${output[@]}" \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${from[@]}" "${image_to[@]}" \
            --metadata-file "${meta}/${name}.json" \
            || fail "image build failed (${dockerfile})"
          echo "::endgroup::"

          digest=""
          if [ "$PUSH" = "true" ]; then
            digest=$(jq -r '."containerimage.digest" // ""' < "${meta}/${name}.json")
            [ -n "$digest" ] || fail "pushed, but buildx reported no digest"
          fi
          echo "${name}: $(artifact_ref "$image" "$digest")"
          out+=("$(printf '%s\t%s\t%s' "$name" "$image" "$digest")")
        done 3<<< "$list"
        rm -rf "$meta"

        images=$(printf '%s\n' "${out[@]}" | artifact_list)
        echo "images=${images}" >> "$GITHUB_OUTPUT"
