name: GitOps PR
description: >
  Record a Release in the GitOps repo through a pull request. The recording
  itself — no downgrade, pin by digest, version label, the Release on the
  Application, and the check that the rendered manifests run every
  image@digest — is actions/record/record.sh, on a checkout; this action is
  its GitHub adapter: a token for the GitOps repo, the checkout, then a
  branch, a PR (an open one of an earlier attempt reused), the manifest
  checks waited for through the REST API, the merge. ArgoCD rolls out what
  lands on main. The repo is private on the free plan, so GitHub cannot
  require the checks or auto-merge — this action waits for them and merges
  itself. In a dry run the token can only read, the checkout keeps no
  credentials and nothing is pushed: it prints the diff it would record.
  A dry run can also record in a GitOps checkout it is given (`checkout`,
  e.g. a git copy of fixtures/gitops): then no token and no clone either.
inputs:
  app:
    description: Application directory under manifests/ (e.g. pepic)
    required: true
  version:
    description: Release version (e.g. 1.4.0)
    required: true
  images:
    description: >
      The Artifact list to record, [{"name", "image", "digest"}], digests set
      (actions/artifact/artifact.sh): each image is pinned as image@digest.
    required: true
  release-url:
    description: Link to the service release, for the PR body
    default: ""
  source-sha:
    description: >
      The release commit, full SHA. Written with source-repo, version, images
      and environment-url as kindorg.dev/* annotations on apps/<app>.yaml,
      for ArgoCD to report running / degraded on that commit. Empty: no
      annotations (ArgoCD then reports to Telegram only).
    default: ""
  source-repo:
    description: URL of the service repo, for kindorg.dev/source-repo
    default: ${{ github.server_url }}/${{ github.repository }}
  environment-url:
    description: Where the service answers, for kindorg.dev/environment-url (optional)
    default: ""
  app-id:
    description: GitHub App id (kindorg-ci); not needed with `checkout`
    default: ""
  private-key:
    description: GitHub App private key; not needed with `checkout`
    default: ""
  gitops-repo:
    description: owner/name of the GitOps repo
    default: kindorg-hq/homelab-k8s
  checks-timeout:
    description: Seconds to wait for the manifest checks
    default: "600"
  dry-run:
    description: >
      "true": record on a read-only checkout and print the diff; no branch,
      no PR, nothing pushed (self-test)
    default: "false"
  checkout:
    description: >
      Dry run only: a git checkout of a GitOps tree to record in instead of
      cloning gitops-repo (no token, no clone); it must be clean and is left
      changed
    default: ""
outputs:
  changed:
    description: '"true" when the Release was not recorded yet (the checkout changed), "false" when it already was'
    value: ${{ steps.record.outputs.changed }}
  diff:
    description: What the recording changes in the GitOps repo (git diff); empty when nothing
    value: ${{ steps.record.outputs.diff }}
  pr-url:
    description: The merged GitOps PR; empty when nothing changed and in a dry run
    value: ${{ steps.pr.outputs.url }}
runs:
  using: composite
  steps:
    - id: target
      shell: bash
      env:
        REPO: ${{ inputs.gitops-repo }}
        CHECKOUT: ${{ inputs.checkout }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        if [ -n "$CHECKOUT" ] && [ "$DRY_RUN" != true ]; then
          echo "::error::gitops-pr: a given checkout is for a dry run only; a delivery records in a fresh clone of $REPO"; exit 1; fi
        echo "dir=${CHECKOUT:-.gitops}" >> "$GITHUB_OUTPUT"
        echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
        echo "name=${REPO##*/}" >> "$GITHUB_OUTPUT"

    # a token for the GitOps repo only, valid for an hour; in a dry run it
    # can only read
    - id: token
      if: inputs.checkout == ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ steps.target.outputs.owner }}
        repositories: ${{ steps.target.outputs.name }}
        permission-contents: ${{ inputs.dry-run == 'true' && 'read' || '' }}

    - if: inputs.checkout == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.gitops-repo }}
        token: ${{ steps.token.outputs.token }}
        path: .gitops
        persist-credentials: ${{ inputs.dry-run != 'true' }}

    # The recording, all of it on files (actions/record/record.sh): refused
    # when lower than the recorded version, failed when the rendered
    # manifests would not run every image@digest. Its stdout is the diff.
    - id: record
      shell: bash
      env:
        APP: ${{ inputs.app }}
        VERSION: ${{ inputs.version }}
        IMAGES: ${{ inputs.images }}
        SOURCE_REPO: ${{ inputs.source-repo }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        ENVIRONMENT_URL: ${{ inputs.environment-url }}
        DRY_RUN: ${{ inputs.dry-run }}
        DIR: ${{ steps.target.outputs.dir }}
        WHERE: ${{ inputs.checkout && format('the GitOps checkout {0}', inputs.checkout) || inputs.gitops-repo }}
      run: |
        set -euo pipefail
        diff=$(bash "$GITHUB_ACTION_PATH/../record/record.sh" "$DIR" "$APP")
        changed=false; [ -z "$diff" ] || changed=true
        eof="EOF_$(openssl rand -hex 8)"
        { echo "changed=$changed"; echo "diff<<$eof"; [ -z "$diff" ] || printf '%s\n' "$diff"; echo "$eof"; } >> "$GITHUB_OUTPUT"
        [ -z "$diff" ] || printf '%s\n' "$diff"
        [ "$DRY_RUN" = true ] || exit 0
        at=$(git -C "$DIR" rev-parse --short HEAD)
        notes=${KINDORG_CI_NOTES:-$GITHUB_STEP_SUMMARY}
        if [ "$changed" = true ]; then
          printf 'Dry run: %s %s would be recorded in %s (at `%s`) with this diff; nothing pushed.\n\n```diff\n%s\n```\n' \
            "$APP" "$VERSION" "$WHERE" "$at" "$diff" >> "$notes"
        else
          echo "Dry run: ${WHERE} (at \`${at}\`) already records ${APP} ${VERSION}: no diff, nothing pushed." >> "$notes"
        fi

    - id: pr
      if: inputs.dry-run != 'true'
      shell: bash
      working-directory: .gitops
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        REPO: ${{ inputs.gitops-repo }}
        APP: ${{ inputs.app }}
        VERSION: ${{ inputs.version }}
        IMAGES: ${{ inputs.images }}
        RELEASE_URL: ${{ inputs.release-url }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        SLUG: ${{ steps.token.outputs.app-slug }}
        CHANGED: ${{ steps.record.outputs.changed }}
        TIMEOUT: ${{ inputs.checks-timeout }}
      run: |
        set -euo pipefail
        jq() { docker run --rm -i ghcr.io/jqlang/jq:1.8.2@sha256:b9c68867e5766576263a222e91db3de422d802069c7af70440e667a95344e486 "$@"; }
        source "$GITHUB_ACTION_PATH/../artifact/artifact.sh"
        if [ "$CHANGED" != true ]; then
          echo "Manifests already at ${APP} ${VERSION}, nothing to deliver"
          exit 0
        fi
        uid=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
        git config user.name "${SLUG}[bot]"
        git config user.email "${uid}+${SLUG}[bot]@users.noreply.github.com"
        branch="deliver/${APP}/${VERSION}"
        git switch -c "$branch"
        git commit -qam "deploy(${APP}): ${VERSION}"
        git push -q --force origin "$branch"
        note="No release annotations on the Application: ArgoCD reports this one to Telegram only."
        [ -z "$SOURCE_SHA" ] || note="\`apps/${APP}.yaml\` carries the release (\`kindorg.dev/*\` annotations, commit \`${SOURCE_SHA}\`): ArgoCD reports it running or degraded on GitHub."
        body=$(printf 'Release %s of %s.\n\n%s\n\nImages (pinned by digest):\n%s\n\n%s\n\nOpened by the delivery pipeline; it merges this PR once the manifest checks pass.' \
          "$VERSION" "$APP" "$RELEASE_URL" "$(artifact_refs gitops-pr "$IMAGES" digest | sed 's/.*/- `&`/')" "$note")
        # a re-delivery after a failure reuses the PR the failed run opened
        n=$(gh api "repos/${REPO}/pulls?head=${REPO%%/*}:${branch}&state=open" --jq '.[0].number // empty')
        if [ -n "$n" ]; then
          url="https://github.com/${REPO}/pull/${n}"
          echo "Reusing $url"
        else
          url=$(gh pr create --repo "$REPO" --head "$branch" --base main \
            --title "deploy(${APP}): ${VERSION}" --body "$body")
          n=${url##*/}
          echo "Opened $url"
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"
        # Wait on the check runs of the pushed commit through the REST API: the
        # App has checks:read; `gh pr checks` would also need actions:read.
        sha=$(git rev-parse HEAD)
        deadline=$((SECONDS + TIMEOUT))
        while :; do
          [ $SECONDS -lt $deadline ] || { echo "checks on $url did not finish in ${TIMEOUT}s"; exit 1; }
          runs=$(gh api "repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
            --jq '[.check_runs[] | {name, status, conclusion}]')
          total=$(echo "$runs" | jq length)
          failed=$(echo "$runs" | jq -r '.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not)) | "\(.name): \(.conclusion)"')
          [ -z "$failed" ] || { echo "checks failed on $url:"; echo "$failed"; exit 1; }
          pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
          # checks register a few seconds after the push
          [ "$total" -gt 0 ] && [ "$pending" -eq 0 ] && break
          sleep 10
        done
        echo "$runs" | jq -r '.[] | "\(.name): \(.conclusion)"'
        gh api -X PUT "repos/${REPO}/pulls/${n}/merge" -f merge_method=squash -f sha="$sha" --silent
        gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}" --silent || true
        echo "Merged $url — ArgoCD takes it from here" >> "${KINDORG_CI_NOTES:-$GITHUB_STEP_SUMMARY}"
