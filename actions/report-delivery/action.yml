name: Report delivery
description: >
  Make a recorded Release visible where the work happened. Every PR of the
  Release gets the "released" label and one comment "vX.Y.Z recorded" with
  links to the GitHub Release and the GitOps PR; the release commit gets a
  GitHub Deployment to "production" in state in_progress. From there ArgoCD
  owns both: it edits the comment into running / degraded and sets the
  deployment's final state (the comment tag below is the contract).

  PRs of a Release: the PRs of the commits since the previous vX.Y.Z tag; for
  the first Release, the release commit's PR. Re-running edits the comment
  and reuses the deployment, never adds another. A run that recorded nothing
  new (gitops-pr empty: the manifests already had this version) leaves an
  existing comment and deployment as they are, so "running" is not turned
  back into "recorded" — ArgoCD would not report an unchanged revision again.
inputs:
  version:
    description: Release version (e.g. 1.4.0)
    required: true
  ref:
    description: The release commit — its tag (v1.4.0) or SHA
    required: true
  release-url:
    default: ""
  gitops-pr:
    description: URL of the GitOps PR merged by this run; empty when nothing new was recorded
    default: ""
  environment-url:
    description: Where the service answers, shown on the production deployment
    default: ""
  dry-run:
    description: '"true": write the PRs and the deployment to the summary, change nothing'
    default: "false"
  token:
    description: Token with pull-requests:write and deployments:write (read is enough in dry-run)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        REF: ${{ inputs.ref }}
        RELEASE_URL: ${{ inputs.release-url }}
        GITOPS_PR: ${{ inputs.gitops-pr }}
        ENV_URL: ${{ inputs.environment-url }}
        DRY_RUN: ${{ inputs.dry-run }}
        # Shared with homelab-k8s: ArgoCD Notifications' GitHub service
        # (pullRequestComment.commentTag: delivery) finds its comment on the
        # release commit's PR by this exact marker and edits it in place.
        MARKER: "<!-- argocd-notifications delivery -->"
        ENVIRONMENT: production
        LABEL: released
      run: |
        set -euo pipefail
        repo=$GITHUB_REPOSITORY
        summary() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
        tag="v$VERSION"
        sha=$(gh api "repos/$repo/commits/$REF" --jq .sha)
        recorded_now=false; [ -n "$GITOPS_PR" ] && recorded_now=true

        # --- the PRs of this Release -----------------------------------------
        # previous Release: the highest vX.Y.Z tag below this version
        prev=$({ gh api "repos/$repo/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")' \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "$tag"; } \
               | sort -uV | grep -B1 -x "$tag" | grep -vx "$tag" || true)
        if [ -n "$prev" ]; then
          shas=$(gh api -X GET "repos/$repo/compare/$prev...$sha" -f per_page=100 --paginate --jq '.commits[].sha')
        else
          shas=$sha
        fi
        # on main a commit's PR is the merged one; a dry run looks at a PR's
        # own commits, whose PR is still open
        filter='.[] | select(.merged_at != null) | .number'
        [ "$DRY_RUN" = true ] && filter='.[].number'
        prs=$(for s in $shas; do gh api "repos/$repo/commits/$s/pulls" --jq "$filter"; done | sort -un)
        release_pr=$(gh api "repos/$repo/commits/$sha/pulls" --jq "$filter" | head -n1 || true)

        body="**$tag recorded** in homelab-k8s"
        if [ -n "$RELEASE_URL" ] || [ -n "$GITOPS_PR" ]; then
          body+=" —"
          [ -n "$RELEASE_URL" ] && body+=" [Release $tag]($RELEASE_URL)"
          [ -n "$RELEASE_URL" ] && [ -n "$GITOPS_PR" ] && body+=" ·"
          [ -n "$GITOPS_PR" ] && body+=" [GitOps PR]($GITOPS_PR)"
        fi
        body+=$'\n\n'"Recorded means in homelab-k8s, not yet running: the \`$ENVIRONMENT\` deployment of ${sha:0:7} is the source of truth."
        body+=$'\n\n'"$MARKER"

        # --- the production deployment of the release commit ------------------
        # one per release commit and environment, ref = the full SHA: ArgoCD
        # looks it up by exactly that pair and adds the final status
        deployment=$(gh api -X GET "repos/$repo/deployments" -f ref="$sha" -f environment="$ENVIRONMENT" \
          --jq "[.[] | select(.ref == \"$sha\")][0].id // empty")
        payload=$(printf '{"ref":"%s","environment":"%s","description":"%s","auto_merge":false,"required_contexts":[],"production_environment":true,"transient_environment":false}' \
          "$sha" "$ENVIRONMENT" "$tag")
        log_url=${GITOPS_PR:-$RELEASE_URL}

        if [ "$DRY_RUN" = true ]; then
          summary "### Dry run: report $tag as recorded"
          summary "Release commit \`$sha\`, its PR: ${release_pr:+#}${release_pr:-none}. Previous Release: ${prev:-none (first Release)}."
          summary ""
          summary "PRs that would get the \`$LABEL\` label and the comment:"
          for n in $prs; do summary "- #$n"; done
          [ -n "$prs" ] || summary "- none"
          summary ""
          if [ -n "$deployment" ]; then
            summary "Deployment: would reuse #$deployment ($ENVIRONMENT, $sha)."
          else
            summary "Deployment: would create"
            summary '```json'
            summary "$payload"
            summary '```'
          fi
          summary "with status \`in_progress\`, log_url \`${log_url:-none}\`, environment_url \`${ENV_URL:-none}\`."
          summary ""
          summary "Comment:"
          summary '```markdown'
          summary "$body"
          summary '```'
          exit 0
        fi

        if [ -z "$deployment" ]; then
          deployment=$(echo "$payload" | gh api "repos/$repo/deployments" --input - --jq .id)
          recorded_now=true
        fi
        if [ "$recorded_now" = true ]; then
          gh api "repos/$repo/deployments/$deployment/statuses" -f state=in_progress \
            -f description="$tag recorded in homelab-k8s" \
            ${log_url:+-f log_url="$log_url"} ${ENV_URL:+-f environment_url="$ENV_URL"} --silent
        fi
        summary "### $tag recorded"
        summary "Deployment #$deployment to \`$ENVIRONMENT\` on \`$sha\`$([ "$recorded_now" = true ] && echo ": in_progress" || echo ", left as it was (nothing new recorded)")."
        summary ""

        # --- label and one comment per PR -------------------------------------
        gh api "repos/$repo/labels" -f name="$LABEL" -f color=0e8a16 \
          -f description="In a Release: recorded for Production" --silent 2>/dev/null || true
        for n in $prs; do
          gh api "repos/$repo/issues/$n/labels" -f "labels[]=$LABEL" --silent
          ids=$(gh api "repos/$repo/issues/$n/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id")
          id=${ids%%$'\n'*}
          if [ -z "$id" ]; then
            gh api "repos/$repo/issues/$n/comments" -f body="$body" --silent
            summary "- #$n: labelled, commented"
          elif [ "$recorded_now" = true ]; then
            gh api -X PATCH "repos/$repo/issues/comments/$id" -f body="$body" --silent
            summary "- #$n: labelled, comment edited"
          else
            summary "- #$n: labelled, comment left as it was"
          fi
        done
