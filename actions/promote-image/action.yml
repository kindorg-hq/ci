name: Promote image
description: >
  Give already built images a release tag — without rebuilding them, one
  after the other in one step. `images` is the Artifact list
  (actions/artifact/artifact.sh), every entry pushed (with a digest): what
  Build pushed, or what find-artifact found for the release commit. For
  each, adds the version tag to that very manifest (image@digest) and reads
  the tag back: the digest must not change — what was scanned is byte for
  byte what gets delivered. Renames nothing: the output is the list as read
  back from the registry, the same as the input when all went well. The
  first image that fails stops the step, named in the error.
inputs:
  images:
    description: The Artifact list to promote, [{"name", "image", "digest"}], digests set
    required: true
  to-tag:
    description: Tag to add — the release version
    required: true
  token:
    description: Token with packages:write
    required: true
outputs:
  images:
    description: >
      The Artifact list, in input order, each digest as the version tag
      resolves to it: scan-image and gitops-pr take it as their `images`.
    value: ${{ steps.promote.outputs.images }}
runs:
  using: composite
  steps:
    - id: promote
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        TO: ${{ inputs.to-tag }}
        TOKEN: ${{ inputs.token }}
        # crane re-puts the same manifest under a new tag: same bytes, same
        # digest. (buildx imagetools create may rebuild the index.)
        CRANE: gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../artifact/artifact.sh"
        list=$(artifact_rows promote-image "$IMAGES" digest)

        cfg=$(mktemp -d)
        trap 'rm -rf "$cfg"' EXIT
        # as the runner's user: the credentials dir is private (mktemp -d, 0700)
        run=(docker run --rm -u "$(id -u):$(id -g)" -v "$cfg:/cfg" -e DOCKER_CONFIG=/cfg)
        crane() { "${run[@]}" "$CRANE" "$@" < /dev/null; }
        echo "$TOKEN" | "${run[@]}" -i "$CRANE" \
          auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

        out=()
        # fd 3: docker run must not eat the list
        while IFS=$'\t' read -r -u 3 name image digest; do
          crane tag "$(artifact_ref "$image" "$digest")" "$TO" || {
            echo "::error::promote-image: ${name}: no artifact ${image}@${digest} to tag"; exit 1; }
          promoted=$(crane digest "${image}:${TO}")
          if [ "$digest" != "$promoted" ]; then
            echo "::error::promote-image: ${name}: promotion changed the digest: $digest → $promoted"; exit 1
          fi
          echo "${image}:${TO} → ${promoted}" | tee -a "${KINDORG_CI_NOTES:-$GITHUB_STEP_SUMMARY}"
          out+=("$(printf '%s\t%s\t%s' "$name" "$image" "$promoted")")
        done 3<<< "$list"

        images=$(printf '%s\n' "${out[@]}" | artifact_list)
        echo "images=${images}" >> "$GITHUB_OUTPUT"
