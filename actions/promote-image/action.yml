name: Promote image
description: >
  Give already built images a release tag — without rebuilding them, one
  after the other in one step. `images` is a JSON list of {"name"} (images
  under ghcr.io/<owner>/, as build-image takes them); v3 callers pass one full
  image name as `image` instead. For each, finds the image built for a commit
  (tagged with the commit SHA on merge), adds the version tag to the very same
  manifest, and checks the digest did not change: what was scanned on merge
  is byte for byte what gets delivered. The first image that fails stops the
  step, named in the error.
inputs:
  images:
    description: >
      JSON list of images to promote, each {"name"} under ghcr.io/<owner>/
      (e.g. [{"name": "pepic"}, {"name": "pepic-worker"}]). Takes precedence
      over `image`.
    default: ""
  image:
    description: One full image name (e.g. ghcr.io/kindorg-hq/pepic) — the v3 form; use `images` for a list
    default: ""
  from-tag:
    description: Tag of the built artifact — the commit SHA
    required: true
  to-tag:
    description: Tag to add — the release version
    required: true
  token:
    description: Token with packages:write
    required: true
outputs:
  images:
    description: >
      JSON list, in input order, of {"name", "image", "ref", "digest"} per
      image (ref is image@digest): scan-image takes it as its `images`,
      gitops-pr as its `images` ({"name", "digest"}).
    value: ${{ steps.promote.outputs.images }}
  digest:
    description: The first image's digest (unchanged by promotion) — the v3 single-image output
    value: ${{ steps.promote.outputs.digest }}
runs:
  using: composite
  steps:
    - id: promote
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        IMAGE: ${{ inputs.image }}
        FROM: ${{ inputs.from-tag }}
        TO: ${{ inputs.to-tag }}
        TOKEN: ${{ inputs.token }}
        OWNER: ${{ github.repository_owner }}
        # crane re-puts the same manifest under a new tag: same bytes, same
        # digest. (buildx imagetools create may rebuild the index.)
        CRANE: gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1
        JQ: ghcr.io/jqlang/jq:1.8.2@sha256:b9c68867e5766576263a222e91db3de422d802069c7af70440e667a95344e486
      run: |
        set -euo pipefail
        jq() { docker run --rm -i "$JQ" "$@"; }

        # the list as "name<TAB>full image": `images`, or the v3 single image
        if [ -z "$IMAGES" ]; then
          [ -n "$IMAGE" ] || { echo "::error::promote-image: give \`images\` (a JSON list) or \`image\`"; exit 1; }
          list=$(printf '%s\t%s' "${IMAGE##*/}" "$IMAGE")
        else
          list=$(echo "$IMAGES" | jq -r --arg owner "${OWNER,,}" '
            if type == "array" and length > 0 and all(.[]; type == "object" and (.name | type) == "string")
            then .[] | [.name, "ghcr.io/\($owner)/\(.name)"] | @tsv
            else error("bad images") end') || {
            echo "::error::promote-image: images must be a non-empty JSON list of {\"name\"}, got: ${IMAGES}"; exit 1; }
        fi

        cfg=$(mktemp -d)
        trap 'rm -rf "$cfg"' EXIT
        # as the runner's user: the credentials dir is private (mktemp -d, 0700)
        run=(docker run --rm -u "$(id -u):$(id -g)" -v "$cfg:/cfg" -e DOCKER_CONFIG=/cfg)
        crane() { "${run[@]}" "$CRANE" "$@" < /dev/null; }
        echo "$TOKEN" | "${run[@]}" -i "$CRANE" \
          auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

        out=()
        # fd 3: docker run must not eat the list
        while IFS=$'\t' read -r -u 3 name image; do
          [[ "$name" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || {
            echo "::error::promote-image: \"${name}\" is not an image name (lowercase letters, digits, . _ -)"; exit 1; }
          built=$(crane digest "${image}:${FROM}") || {
            echo "::error::promote-image: ${name}: no artifact ${image}:${FROM} — was it built on merge to the main branch?"; exit 1; }
          crane tag "${image}@${built}" "$TO"
          promoted=$(crane digest "${image}:${TO}")
          if [ "$built" != "$promoted" ]; then
            echo "::error::promote-image: ${name}: promotion changed the digest: $built → $promoted"; exit 1
          fi
          echo "${image}:${TO} → ${built} (built for ${FROM})" | tee -a "$GITHUB_STEP_SUMMARY"
          out+=("$(printf '%s\t%s\t%s' "$name" "$image" "$built")")
        done 3<<< "$list"

        images=$(printf '%s\n' "${out[@]}" | jq -Rnc \
          '[inputs | split("\t") | {name: .[0], image: .[1], ref: "\(.[1])@\(.[2])", digest: .[2]}]')
        {
          echo "images=${images}"
          echo "digest=$(printf '%s' "${out[0]}" | cut -f3)"
        } >> "$GITHUB_OUTPUT"
