# git-cliff: the next version and the notes of a Release, from the Conventional
# Commits since the last vX.Y.Z tag (release-please tags count as well).
# Each line names its work item: a squash-merged PR title is type(#N): summary
# (#PR), and GitHub links every #N in a Release body.

[changelog]
header = ""
body = """
{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking %}
### Breaking changes
{% for commit in breaking %}
- {% if commit.scope %}{{ commit.scope }} {% endif %}{{ commit.breaking_description | default(value=commit.message) | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }} {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# vX.Y.Z only: the moving major tags (v2) of kindorg-hq/ci are not Releases
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# the HTML comments order the groups; striptags hides them
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(ci|build)", group = "<!-- 6 -->Pipeline" },
  { message = ".*", group = "<!-- 7 -->Other" },
]

[bump]
# feat → minor, fix/perf → patch, breaking → major — also below 1.0.0
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
